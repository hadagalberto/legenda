name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install ffmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg with libass (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Homebrew core's ffmpeg is built without libass, so it has neither
          # the 'subtitles' nor the 'ass' filter. ffmpeg-full includes libass
          # but is keg-only: prepend its bin directory so later steps resolve
          # both `ffmpeg` and `ffprobe` to that build.
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Verify ffmpeg can burn subtitles (libass)
        shell: bash
        run: |
          echo "ffmpeg on PATH: $(command -v ffmpeg)"
          if ! ffmpeg -hide_banner -filters \
              | grep -E '^ *[^[:space:]]+ +(subtitles|ass) +' >/dev/null; then
            echo "::error::ffmpeg lacks libass: the 'subtitles'/'ass' filter is missing. Install a build with --enable-libass (macOS: brew install ffmpeg-full)."
            ffmpeg -hide_banner -filters | grep -i -E 'libass|subtitles|ass' || true
            exit 1
          fi
          ffmpeg -hide_banner -filters | grep -E '^ *[^[:space:]]+ +(subtitles|ass) +'

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test suite
        run: cargo test --workspace --all-targets

      - name: Test suite (release)
        # Enforces the SPEC performance bound for parse + write of 100k cues.
        run: cargo test --workspace --release

      - name: Release build
        run: cargo build --workspace --release
